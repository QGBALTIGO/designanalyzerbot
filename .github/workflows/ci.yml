name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Dependency contract
        run: |
          python -c "import telegram; print(telegram.__version__)"
          designsys --help >/dev/null
      - name: Syntax check
        run: python -m compileall -q app main.py scripts tests
      - name: Unit tests
        run: pytest -q
      - name: Offline smoke test
        run: PYTHONPATH=. python scripts/smoke.py
