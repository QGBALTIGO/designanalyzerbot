name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Dependency contract
        run: |
          python -c "import telegram; print(telegram.__version__)"
          designsys --help >/dev/null
      - name: Syntax check
        run: python -m compileall -q app main.py scripts tests
      - name: Unit tests
        run: PYTHONPATH=. pytest -q
      - name: Offline smoke test
        run: PYTHONPATH=. python scripts/smoke.py
      - name: Install Chromium for capture smoke
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python -m playwright install --with-deps chromium
      - name: Real Chromium clone smoke
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: PYTHONPATH=. python scripts/capture_smoke.py
      - name: Real BaltigoFlix clone smoke
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[site-smoke]')
        env:
          CAPTURE_SMOKE_URL: https://baltigoflix.com.br/
        run: PYTHONPATH=. python scripts/capture_smoke.py

      - name: Build premium production image
        if: github.ref == 'refs/heads/premium-suite'
        run: docker build -t design-analyzer-premium:test .
      - name: Premium production smoke
        if: github.ref == 'refs/heads/premium-suite'
        run: docker run --rm design-analyzer-premium:test python scripts/premium_smoke.py
